name: CI

# Runs on every pull request and on whatever lands on main, so a merge that
# breaks the build is visible immediately rather than at the next deploy.
on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the run already in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Assert no secrets reached the client
        run: node scripts/check-bundle.mjs

      - name: Assert the docs name real commands
        run: node scripts/check-docs.mjs
